<style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.flow{stroke-dasharray:5 13;animation:flow 12s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.still{display:none}@keyframes flow{to{stroke-dashoffset:-180}}@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.spin{animation:none}.motion{display:none}.still{display:inline}}</style><rect width="1000" height="520" rx="16" fill="#050910"/><rect x=".5" y=".5" width="999" height="519" rx="16" fill="none" stroke="#1b3449"/><rect width="1000" height="520" rx="16" fill="url(#grid)"/><ellipse cx="745" cy="240" rx="380" ry="300" fill="url(#aura)"/><text x="42" y="39" font-size="12" fill="#43e8ef" class="mono" letter-spacing="2">AARYA / ENGINEERING LAB</text><text x="758" y="39" font-size="12" fill="#93a8bd" class="mono" letter-spacing="2">PROFILE INTERFACE / 01</text><path d="M42 57L958 57" stroke="#1b3449" fill="none" /><g transform="translate(798 249)"><g opacity=".45"><circle r="132" fill="none" stroke="#1b3449"/><circle r="112" fill="none" stroke="#43e8ef" stroke-dasharray="1 9"/><circle r="90" fill="none" stroke="#ae8aff" stroke-dasharray="50 30" class="spin"/></g><ellipse rx="132" ry="42" transform="rotate(-35)" fill="none" stroke="#43e8ef" opacity=".4"/><ellipse rx="132" ry="42" transform="rotate(35)" fill="none" stroke="#ae8aff" opacity=".4"/><path d="M-60 0L0-37 60 0 0 37Z M-60 0V57L0 93 60 57V0 M0 37V93" fill="#0b2334" stroke="#43e8ef" stroke-width="1.5"/><text x="0" y="20" font-size="29" fill="#eff7ff" text-anchor="middle" class="mono">AL</text><circle cx="0" cy="-132" r="4" fill="#43e8ef" filter="url(#glow)" class="pulse"/></g><text x="45" y="111" font-size="12" fill="#93a8bd" class="mono" letter-spacing="2">FIRST-YEAR BTECH / CSE CORE / VIT CHENNAI</text><text x="40" y="213" font-size="100" fill="#e