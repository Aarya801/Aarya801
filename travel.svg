<style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.flow{stroke-dasharray:5 13;animation:flow 12s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.still{display:none}@keyframes flow{to{stroke-dashoffset:-180}}@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.spin{animation:none}.motion{display:none}.still{display:inline}}</style><rect width="900" height="278" rx="16" fill="#050910"/><rect x=".5" y=".5" width="899" height="277" rx="16" fill="none" stroke="#1b3449"/><ellipse cx="822" cy="140" rx="155" ry="150" fill="url(#aura)"/><text x="30" y="32" font-size="12" fill="#43e8ef" class="mono" letter-spacing="2">AI / MACHINE LEARNING</text><text x="30" y="66" font-size="12" fill="#93a8bd" class="mono" letter-spacing="2">PERSONAL PROJECT</text><text x="28" y="123" font-size="42" fill="#eff7ff" font-weight="700" letter-spacing="-1">AI Travel Analyst</text><text x="30" y="163" font-size="19" fill="#eff7ff" >From messy flight data to price estimates.</text><text x="30" y="194" font-size="16" fill="#93a8bd" >Cleaning · features · evaluation · dashboard</text><path d="M30 221L870 221" stroke="#1b3449" fill="none" /><text x="30" y="250" font-size="15" fill="#43e8ef" class="mono">Python · CatBoost · Streamlit</text><text x="762" y="250" font-size="13" fill="#93a8bd" class="mono">OPEN REPO ↗</text><g transform="translate(791 127)" fill="none" stroke="url(#edge)" stroke-width="1.6"><path d="M-60 55H65M-60-60V55M-50 35L-30 12-10 24 16-9 38-22 62-47"/><circle cx="-48" cy="39" r="3" fill="#43e8ef"/><circle cx="-34" cy="47" r="3" fill="#43e8ef"/><circle cx="-20" cy="19" r="3" fill="#43e8ef"/><circle cx="-6" cy="27" r="3" fill="#43e8ef"/><circle cx="8" cy="-1" r="3" fill="#43e8ef"/><circle cx="22" cy="7" r="3" fill="#43e8ef"/><circle cx="36" cy="-21" r="3" fill="#43e8ef