<style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.flow{stroke-dasharray:5 13;animation:flow 12s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.still{display:none}@keyframes flow{to{stroke-dashoffset:-180}}@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.spin{animation:none}.motion{display:none}.still{display:inline}}</style><rect width="440" height="500" rx="16" fill="#050910"/><rect x=".5" y=".5" width="439" height="499" rx="16" fill="none" stroke="#1b3449"/><text x="24" y="32" font-size="12" fill="#43e8ef" class="mono" letter-spacing="2">ENGINEERING / CAD</text><text x="24" y="59" font-size="11" fill="#93a8bd" class="mono">PERSONAL PROJECT · DRAFT</text><text x="23" y="103" font-size="34" fill="#eff7ff" font-weight="700">ASTRA-66</text><text x="24" y="149" font-size="15" fill="#43e8ef" class="mono">Python · OpenSCAD</text><text x="24" y="184" font-size="17" fill="#eff7ff" >Parametric CAD meets</text><text x="24" y="209" font-size="17" fill="#eff7ff" >reproducible analysis.</text><path d="M24 459L416 459" stroke="#1b3449" fill="none" /><text x="24" y="487" font-size="12" fill="#93a8bd" class="mono" letter-spacing="2">OPEN REPOSITORY ↗</text><defs><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#214c66"/><stop offset=".5" stop-color="#10283f"/><stop offset="1" stop-color="#09111f"/></linearGradient><linearGradient id="metal"><stop stop-color="#53819a"/><stop offset=".35" stop-color="#c4e6f3"/><stop offset=".6" stop-color="#29475f"/><stop offset="1" stop-color="#0d2134"/></linearGradient></defs><style>.float3{animation:float3 6s ease-in-out infinite}.signal{stroke-dasharray:5 17;animation:signal 4s linear infinite}.blink3{animation:blink3 4s ease-in-out infinite}.orbit3{animation:orbit3 24s linear infinite;transform-origin:0px 0px}@key