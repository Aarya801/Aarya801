<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="188" viewBox="0 0 1000 188" role="img" aria-labelledby="title desc"><title id="title">MiniDB CLI to parser to Database, with hash table, LRU cache, WAL and snapshots</title><desc id="desc">MiniDB CLI to parser to Database, with hash table, LRU cache, WAL and snapshots</desc><defs>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#284153" stroke-width=".6" opacity=".35"/></pattern>
<radialGradient id="aura"><stop stop-color="#175773" stop-opacity=".6"/><stop offset="1" stop-color="#050910" stop-opacity="0"/></radialGradient>
<linearGradient id="beam"><stop stop-color="#43e8ef" stop-opacity="0"/><stop offset=".5" stop-color="#43e8ef"/><stop offset="1" stop-color="#ae8aff" stop-opacity="0"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#43e8ef"/><stop offset="1" stop-color="#ae8aff"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.flow{stroke-dasharray:5 13;animation:flow 12s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.still{display:none}@keyframes flow{to{stroke-dashoffset:-180}}@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.spin{animation:none}.motion{display:none}.still{display:inline}}</style><rect width="1000" height="188" rx="16" fill="#050910"/><rect x=".5" y=".5" width="999" height="187" rx="16" fill="none" stroke="#1b3449"/><text x="28" y="31" font-size="12" fill="#43e8ef" class="mono" letter-spacing="2">MINIDB / STORAGE PATH</text><text x="639" y="31" font-size="12" fill="#93a8bd" class="mono" letter-spacing="2">SIMPLIFIED COMPONENT RELATIONSHIPS</text><rect x="32" y="66" width="154" height="64" rx="12" fill="#091321" stroke="#1b3449" /><text x="109" y="105" font-size="20" fill="#eff7ff" text-anchor="middle">CLI</text><path d="M186 98L212 98" stroke="#43e8ef" fill="none" class="flow"/><rect x="212" y="66" width="154" height="64" rx="12" fill="#091321" stroke="#1b3449" /><text x="289" y="105" font-size="20" fill="#eff7ff" text-anchor="middle">Parser</text><path d="M366 98L392 98" stroke="#43e8ef" fill="none" class="flow"/><rect x="392" y="66" width="154" height="64" rx="12" fill="#091321" stroke="#1b3449" /><text x="469" y="105" font-size="20" fill="#eff7ff" text-anchor="middle">Database</text><path d="M546 98L622 98" stroke="#43e8ef" fill="none" class="flow"/><rect x="622" y="66" width="332" height="64" rx="12" fill="#091321" stroke="#1b3449" /><text x="788" y="105" font-size="20" fill="#eff7ff" text-anchor="middle">WAL / snapshot</text><text x="392" y="160" font-size="15" fill="#43e8ef" >Hash table + LRU cache</text><text x="622" y="160" font-size="15" fill="#93a8bd" >Log before mutation · replay on startup</text></svg>
