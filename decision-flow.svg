<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="189" viewBox="0 0 1000 189" role="img" aria-labelledby="title desc"><title id="title">DecisionOS scenario intelligence flow; Aarya contributes the frontend</title><desc id="desc">DecisionOS scenario intelligence flow; Aarya contributes the frontend</desc><defs>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#284153" stroke-width=".6" opacity=".35"/></pattern>
<radialGradient id="aura"><stop stop-color="#175773" stop-opacity=".6"/><stop offset="1" stop-color="#050910" stop-opacity="0"/></radialGradient>
<linearGradient id="beam"><stop stop-color="#43e8ef" stop-opacity="0"/><stop offset=".5" stop-color="#43e8ef"/><stop offset="1" stop-color="#ae8aff" stop-opacity="0"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#43e8ef"/><stop offset="1" stop-color="#ae8aff"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.flow{stroke-dasharray:5 13;animation:flow 12s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.still{display:none}@keyframes flow{to{stroke-dashoffset:-180}}@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.spin{animation:none}.motion{display:none}.still{display:inline}}</style><rect width="1000" height="189" rx="16" fill="#050910"/><rect x=".5" y=".5" width="999" height="188" rx="16" fill="none" stroke="#1b3449"/><text x="28" y="31" font-size="12" fill="#43e8ef" class="mono" letter-spacing="2">DECISIONOS / TEAM SYSTEM</text><text x="677" y="31" font-size="12" fill="#ae8aff" class="mono" letter-spacing="2">MY CONTRIBUTION / FRONTEND</text><rect x="25" y="65" width="170" height="67" rx="12" fill="#091321" stroke="#1b3449" /><text x="110" y="106" font-size="17" fill="#eff7ff" text-anchor="middle" class="mono">INPUT</text><path d="M195 99L220 99" stroke="#ae8aff" fill="none" class="flow"/><rect x="220" y="65" width="170" height="67" rx="12" fill="#091321" stroke="#1b3449" /><text x="305" y="106" font-size="17" fill="#eff7ff" text-anchor="middle" class="mono">SCENARIO</text><path d="M390 99L415 99" stroke="#ae8aff" fill="none" class="flow"/><rect x="415" y="65" width="170" height="67" rx="12" fill="#091321" stroke="#1b3449" /><text x="500" y="106" font-size="17" fill="#eff7ff" text-anchor="middle" class="mono">SIMULATION</text><path d="M585 99L610 99" stroke="#ae8aff" fill="none" class="flow"/><rect x="610" y="65" width="170" height="67" rx="12" fill="#091321" stroke="#1b3449" /><text x="695" y="106" font-size="17" fill="#eff7ff" text-anchor="middle" class="mono">ANALYSIS</text><path d="M780 99L805 99" stroke="#ae8aff" fill="none" class="flow"/><rect x="805" y="65" width="170" height="67" rx="12" fill="#091321" stroke="#1b3449" /><text x="890" y="106" font-size="17" fill="#eff7ff" text-anchor="middle" class="mono">DECISION</text><text x="28" y="161" font-size="17" fill="#93a8bd" >Resource inputs → alternatives → outcomes → trade-offs → ranked recommendations</text></svg>
