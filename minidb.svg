<style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.flow{stroke-dasharray:5 13;animation:flow 12s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.still{display:none}@keyframes flow{to{stroke-dashoffset:-180}}@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.spin{animation:none}.motion{display:none}.still{display:inline}}</style><rect width="900" height="278" rx="16" fill="#050910"/><rect x=".5" y=".5" width="899" height="277" rx="16" fill="none" stroke="#1b3449"/><ellipse cx="822" cy="140" rx="155" ry="150" fill="url(#aura)"/><text x="30" y="32" font-size="12" fill="#43e8ef" class="mono" letter-spacing="2">SYSTEMS / C++</text><text x="30" y="66" font-size="12" fill="#93a8bd" class="mono" letter-spacing="2">PERSONAL PROJECT</text><text x="28" y="123" font-size="42" fill="#eff7ff" font-weight="700" letter-spacing="-1">MiniDB</text><text x="30" y="163" font-size="19" fill="#eff7ff" >A persistent key-value storage engine.</text><text x="30" y="194" font-size="16" fill="#93a8bd" >Hash table · WAL · recovery · transactions</text><path d="M30 221L870 221" stroke="#1b3449" fill="none" /><text x="30" y="250" font-size="15" fill="#43e8ef" class="mono">C++20 · CMake · CTest</text><text x="762" y="250" font-size="13" fill="#93a8bd" class="mono">OPEN REPO ↗</text><defs><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#214c66"/><stop offset=".5" stop-color="#10283f"/><stop offset="1" stop-color="#09111f"/></linearGradient><linearGradient id="metal"><stop stop-color="#53819a"/><stop offset=".35" stop-color="#c4e6f3"/><stop offset=".6" stop-color="#29475f"/><stop offset="1" stop-color="#0d2134"/></linearGradient></defs><style>.float3{animation:float3 6s ease-in-out infinite}.signal{stroke-dasharray:5 17;animation:signal 4s linear infinite}.blink3{animatio