<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="238" viewBox="0 0 1000 238" role="img" aria-labelledby="title desc"><title id="title">Engineering lab terminal — decorative design element, not live logs</title><desc id="desc">Engineering lab terminal — decorative design element, not live logs</desc><defs>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#284153" stroke-width=".6" opacity=".35"/></pattern>
<radialGradient id="aura"><stop stop-color="#175773" stop-opacity=".6"/><stop offset="1" stop-color="#050910" stop-opacity="0"/></radialGradient>
<linearGradient id="beam"><stop stop-color="#43e8ef" stop-opacity="0"/><stop offset=".5" stop-color="#43e8ef"/><stop offset="1" stop-color="#ae8aff" stop-opacity="0"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#43e8ef"/><stop offset="1" stop-color="#ae8aff"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.flow{stroke-dasharray:5 13;animation:flow 12s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.still{display:none}@keyframes flow{to{stroke-dashoffset:-180}}@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.spin{animation:none}.motion{display:none}.still{display:inline}}</style><rect width="1000" height="238" rx="16" fill="#050910"/><rect x=".5" y=".5" width="999" height="237" rx="16" fill="none" stroke="#1b3449"/><text x="30" y="34" font-size="12" fill="#43e8ef" class="mono" letter-spacing="2">AARYA@ENGINEERING-LAB:~$ ./profile</text><text x="776" y="34" font-size="12" fill="#93a8bd" class="mono" letter-spacing="2">DESIGN ELEMENT</text><path d="M28 53L972 53" stroke="#1b3449" fill="none" /><text x="32" y="91" font-size="18" fill="#80e9b0" class="mono">[ focus ]  systems · intelligent software · engineering</text><text x="32" y="125" font-size="18" fill="#93a8bd" class="mono">[ method ]  inspect → model → implement → test → explain</text><text x="32" y="159" font-size="18" fill="#93a8bd" class="mono">[ next ]  stronger evaluation · clearer demos · deeper fundamentals</text><text x="32" y="208" font-size="21" fill="#eff7ff" class="mono">STATUS: BUILDING</text><rect x="262" y="190" width="11" height="22" fill="#43e8ef" class="pulse"/><text x="637" y="210" font-size="14" fill="#93a8bd" >Visual motif · not live runtime logs</text></svg>
